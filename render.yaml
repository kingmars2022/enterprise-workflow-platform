# Render Blueprint: free deployment of the backend and frontend.
# The database is hosted on Neon's free tier; see "Free Deployment" in README.md.
services:
  # Spring Boot API, built from backend/Dockerfile.
  - type: web
    name: enterprise-workflow-api
    runtime: docker
    plan: free
    rootDir: backend
    autoDeployTrigger: checksPass
    healthCheckPath: /api/dashboard/metrics
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PORT
        value: "8080"
      # Neon connection, e.g. jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # The free instance has 512 MB of memory.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=55 -XX:+UseSerialGC -Xss512k"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "20"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "3"

  # React build served as a static site. /api is rewritten to the API service,
  # so the browser stays on one origin and no CORS setup is needed.
  - type: web
    name: enterprise-workflow-web
    runtime: static
    rootDir: frontend
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Must be the API service's public URL. If Render assigns a different
      # subdomain (the name was taken), update it here.
      - type: rewrite
        source: /api/*
        destination: https://enterprise-workflow-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
