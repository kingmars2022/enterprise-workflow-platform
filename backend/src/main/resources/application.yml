server:
  port: 8080

spring:
  application:
    name: enterprise-workflow-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/workflowdb}
    username: ${DATABASE_USERNAME:workflow}
    password: ${DATABASE_PASSWORD:workflow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
